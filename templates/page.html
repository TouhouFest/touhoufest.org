{% extends "base.html" %}

{% block header %}
<p class='title is-1'>{{ page.title }}</p>
{% endblock %}
{% block content %}
<section class="section container post content">
  {% if page.extra.toc %}
  {% include "toc.html" %}
  {% endif %}
  <p>{{ page.content | safe }}</p>
</section>
{% endblock content %}
