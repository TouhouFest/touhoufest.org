{% extends "base.html" %}

{% block header %}
  {% if not page.extra.hide_header %}
    {{ <page_header title={page.title} subtitle={page.extra.subtitle | default(value="")} /> }}
  {% endif %}
{% endblock header %}

{% block content %}
<div class="page-body-container container">
  {% if page.extra.toc %}
    {% include "toc.html" %}
  {% endif %}
  {{ page.content | safe }}
</div>
{% endblock content %}
