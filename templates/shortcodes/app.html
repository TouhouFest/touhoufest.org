<div class='card atom-app'>
  <div class='card-content'>
    <span class='tag is-medium'>{% if open %}OPEN{% else %}CLOSED{% endif %}</span>
    <h2>{{ name }}</h2>
    {% if description %}
      <p>{{ description }}</p>
    {% endif %}
    {%if open %}
      <a class='button is-rounded btn-red'>Apply <span class='fa-solid fa-chevron-right'></a>
    {% endif %}
  </div>
</div>
