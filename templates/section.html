{% extends "base.html" %}

{% block header %}
  {% if not section.extra.hide_header %}
    {{ <page_header title={section.title} /> }}
  {% endif %}
{% endblock header %}

{% block content %}
<div class="page-body-container container">
  {% if section.extra.toc %}
    {% include "toc.html" %}
  {% endif %}
  {{ section.content | safe }}
</div>
{% endblock content %}
