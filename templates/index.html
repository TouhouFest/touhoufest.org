{% extends "base.html" %}

{% block content %}
{%- set home_data = load_data(path="data/home.yml") -%}
<div class="home-page-body">
  <div class="home-page-content">
    <section class="home-hero-banner">
      <img src="{{ get_url(path=home_data.hero.background_image) }}" alt="" class="home-section-bg-img" aria-hidden="true" />
      <div class="home-hero-vignette" aria-hidden="true"></div>
      <div class="divider-wave-bottom home-hero-divider-bottom" aria-hidden="true"></div>
      <div class="home-hero-glass-card">
        <h1 class="home-hero-title">{{ home_data.hero.title }}</h1>
        <p class="home-hero-date">{{ <event_date /> }}</p>
        <a class="tf-btn tf-btn-danger home-cta-btn" href="{{ get_url(path=home_data.hero.button_url) }}">
          <span class="home-cta-label">{{ home_data.hero.button_text }}</span>
          <span class="home-cta-chevron" aria-hidden="true"></span>
        </a>
      </div>
    </section>
    {{ section.content | safe }}
  </div>
</div>
{% endblock content %}
