{% extends "base.html" %}

{% block header %}
<section class="home-hero-banner">
  <div class="divider-wave-top"></div>
  <div class="divider-wave-bottom"></div>
  <div class="home-hero-glass-card">
    <h1 class="home-hero-title">Year 5<br/>Announced!</h1>
    <a class="tf-btn tf-btn-white" href="/register">
      <span>Buy Badge</span>
      <span class="tf-icon tf-icon-chevron-right ml-1"></span>
    </a>
  </div>
  <a class="tf-btn tf-btn-danger home-hero-floating-btn" href="/register">
    <span>Buy Badge</span>
    <span class="tf-icon tf-icon-chevron-right ml-1"></span>
  </a>
</section>
{% endblock header %}

{% block content %}
<div class="container is-max-widescreen px-4">
  {{ section.content | safe }}
  <section class="section">
    <h2 class="title has-text-centered">Latest news and tweets!</h2>
    <div class="has-text-centered">
      <a class="twitter-timeline" href="https://twitter.com/TouhouFest?ref_src=twsrc%5Etfw">Tweets by TouhouFest</a>
      <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
    </div>
  </section>
</div>
{% endblock content %}
