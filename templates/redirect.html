<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Redirecting…</title>
    <link rel="canonical"
          href="{{ get_url(path=page.extra.redirect_path) }}{{ page.extra.redirect_anchor | default(value='') }}">
    <meta http-equiv="refresh"
          content="0; url={{ get_url(path=page.extra.redirect_path) }}{{ page.extra.redirect_anchor | default(value='') }}">
    <meta name="robots" content="noindex">
    <script>window.location.replace("{{ get_url(path=page.extra.redirect_path) }}{{ page.extra.redirect_anchor | default(value='') }}");</script>
  </head>
  <body>
    <p>
      Redirecting to <a href="{{ get_url(path=page.extra.redirect_path) }}{{ page.extra.redirect_anchor | default(value='') }}">{{ page.title }}</a>…
    </p>
  </body>
</html>
