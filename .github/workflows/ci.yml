# On every push this script is executed
on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Rebuild at 12 Midnight every day
  schedule:
    - cron: '0 0 * * *'

name: Build and deploy GH Pages
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install zola
        uses: taiki-e/install-action@v2.86.5
        with:
          tool: zola@0.19.2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile SASS with Dart Sass
        run: npx --yes sass sass/style.scss static/style.css --style=compressed --no-source-map
      - name: Build site
        run: zola build
      - name: Upload site to GitHub Pages
        id: deployment
        uses: actions/upload-pages-artifact@v5
        with:
          path: public/
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
