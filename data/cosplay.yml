workshops:
  subtitle: "Themed photoshoots will be organized by our Cosplay and Photography team. They are listed below as follows: Pine Wind Garden"
  body: "Our venue's Pine Wind Japanese Garden and Circular Drive offer perfect photo opportunities for your Touhou cosplays. At the end of each meetup, our photography team offers open photo sessions for all cosplayers!"
  items:
    - title: "Garden Gathering"
      location: "Pine Wind Garden"
      image: "/img/Group -12.png"
      description: "Traditional garden pathways, stone bridges, and serene bamboo backdrops perfect for shrine maidens and youkai."
    - title: "Circular Drive"
      location: "Front Circular Drive"
      image: "/img/Group -14.png"
      description: "Spacious outdoor plaza with open natural daylight for full group rosters and wide dynamic compositions."
    - title: "Action & Spells"
      location: "Circular Drive West"
      image: "/img/Group -11.png"
      description: "Dedicated staging grounds for spell card dueling poses, wide fabric flows, and dramatic prop staging."

masquerade:
  note: "Those with any further questions related to cosplay events at TouhouFest are encouraged to visit either the Cosplay Ambassadors booth or the Touhou Cosplay Guild booth, both of which are located at the Toyota Meeting Hall."
  categories:
    - name: "Craftsmanship"
      image: "/img/Group -12.png"
      description: "The Craftsmanship category will be judged based on how well you've made your costume. If you're proud of your sewing, foamwork, or any other techniques you used to put your costume together, this category is for you! You'll have time before the contest to meet with the judges so they can see your work up close and ask any questions. During the contest, you'll walk across the stage and strike some cool poses in front of the audience!"
      apply_url: "#"
    - name: "Performance"
      image: "/img/Group -14.png"
      description: "If you love to entertain, then consider entering the Performance category! You don't have to have a self-made costume to perform, rather you'll be judged on how well you're able to capture the audience. This can be through a skit, dance, or anything else you can think of. You can be as comedic or dramatic as you'd like, so get creative!"
      apply_url: "#"
    - name: "Exhibition"
      image: "/img/Group -11.png"
      description: "The Exhibition category is for anyone that wants a chance to walk across the stage, but doesn't want to compete. This is just for fun and is NOT eligible for prizes, so there are no limits to whether you've made your costume yourself or not. Anyone may participate in this category, including staff and guests."
      apply_url: "#"

  craftsmanship_desc: "The Craftsmanship category will be judged based on how well you've made your costume. If you're proud of your sewing, foamwork, or any other techniques you used to put your costume together, this category is for you! You'll have time before the contest to meet with the judges so they can see your work up close and ask any questions. During the contest, you'll walk across the stage and strike some cool poses in front of the audience!"
  craftsmanship_awards:
    - title: "Best Craftsmanship"
      prize: "Free TouhouFest 2026 Badge + Medal"
      description: "This prize is awarded to the participant of the Craftsmanship Contest whose work and effort crafting their costume left the strongest impression on the judges."
      url: "/about/guidelines#craftsmanship-rules"
    - title: "Runner-up Best Craftsmanship"
      prize: "Free TouhouFest 2026 Badge + Medal"
      description: "This prize is awarded to the participant of the Craftsmanship Contest whose work and effort crafting their costume greatly impressed the judges."
      url: "/about/guidelines#craftsmanship-rules"
    - title: "Judge's Choice Awards"
      prize: "Prizes TBD"
      description: "Each judge will give an award to a contestant from either contest based on their own personal criteria."
      url: "/about/guidelines#awards"

  performance_desc: "The Performance category will be judged based on how well you're able to capture the audience. This can be through a skit, dance, or anything else you can think of. You can be as comedic or dramatic as you'd like, so get creative!"
  performance_awards:
    - title: "Best Performance"
      prize: "Free TouhouFest 2026 Badge + Medal"
      description: "This prize is awarded to the participant of the Performance Contest whose stage presence, creativity, and execution left the strongest impression on the judges."
      url: "/about/guidelines#performance-rules"
    - title: "Runner-up Best Performance"
      prize: "Free TouhouFest 2026 Badge + Medal"
      description: "This prize is awarded to the participant of the Performance Contest whose choreography, skit, or performance greatly impressed the judges."
      url: "/about/guidelines#performance-rules"
    - title: "Judge's Choice Awards"
      prize: "Prizes TBD"
      description: "Each judge will give an award to a contestant from either contest based on their own personal criteria."
      url: "/about/guidelines#awards"

  itinerary:
    - title: "Pre-Judging"
      time: "Saturday 12:00 PM - 1:00 PM"
      description: "This portion is only for Cosplay Contest participants."
    - title: "Seating"
      time: "Saturday 1:00 PM - 1:30 PM"
      description: "Seating for all guests."
    - title: "Masquerade"
      time: "Saturday 1:30 PM - 3:30 PM"
      description: "During the cosplay judging period, CorpsDanceCrew will be giving a special performance!"

ambassadors:
  - honorific: "Master of Ceremonies"
    name: "Medukitty"
    role: "Cosplay Ambassador"
    image: "/img/Medukitty.png"
    bio: "I'm Medukitty, a long time cosplayer and Touhou enthusiast who's thrilled to combine her two greatest passions! I've been cosplaying from Touhou since 2018, and my favorite thing is making my costumes from scratch with as many details as I can fit into them. I love our community so much and I can't wait to participate in TouhouFest with you all!"
    socials:
      - name: "Instagram"
        url: "https://instagram.com"
      - name: "TikTok"
        url: "https://tiktok.com"
      - name: "Twitter"
        url: "https://twitter.com"
  - honorific: "Cosplay Ambassador"
    name: "Mystical Lala"
    role: "Cosplay Ambassador"
    image: "/img/Lala _ Remi.jpg"
    bio: "I'm Mystical Lala, a veteran Touhou cosplayer with years of crafting experience across sewing and prop fabrication! Lala has portrayed dozens of Gensokyo characters and co-hosts our convention cosplay gatherings and Fumo meetups. Can't wait to see everyone's incredible outfits!"
    socials:
      - name: "Instagram"
        url: "https://instagram.com"
      - name: "TikTok"
        url: "https://tiktok.com"
      - name: "Twitter"
        url: "https://twitter.com"
  - honorific: "Cosplay Ambassador"
    name: "Pumpking"
    role: "Cosplay Ambassador"
    image: "/img/pumpking.jpg"
    bio: "I'm Pumpking, a passionate cosplay creator and Touhou community member specializing in foam armor fabrication, large props, and character styling! Bringing beloved characters to life on stage and in photoshoots is what I live for. Looking forward to meeting all cosplayers at TouhouFest!"
    socials:
      - name: "Instagram"
        url: "https://instagram.com"
      - name: "TikTok"
        url: "https://tiktok.com"
      - name: "Twitter"
        url: "https://twitter.com"
  - honorific: "Cosplay Guest Judge"
    name: "Purple Uniphants"
    role: "Guest Judge"
    image: "/img/Uniphant + Velpi.png"
    bio: "You can call me Uni! I've been cosplaying since 2011, and I ventured into Touhou shortly after. I have a handful of awards under my belt, but please don't be intimidated: I love seeing how we as cosplayers bring fiction to reality with our own styles and personalities. I owe all of my crafting knowledge to the internet, but I'm still not done learning!"
    socials:
      - name: "Instagram"
        url: "https://instagram.com"
      - name: "TikTok"
        url: "https://tiktok.com"
      - name: "Twitter"
        url: "https://twitter.com"

