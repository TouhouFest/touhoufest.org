masquerade:
  title: "Masquerade"
  divider_image: "img/cosplay/divider_masquerade.jpg"
  categories_heading: "Categories"
  categories_intro: "Those with any further questions related to cosplay events at TouhouFest are encouraged to visit either the Cosplay Ambassadors booth or the Touhou Cosplay Guild booth, both of which are located at the Toyota Meeting Hall."
  apply_label: "Apply"
  categories:
    - key: "craftsmanship"
      title: "Craftsmanship"
      image: "img/cosplay/category_craftsmanship.jpg"
      image_alt: "Craftsmanship category"
      description: "The Craftsmanship category will be judged based on how well you’ve made your costume. If you’re proud of your sewing, foamwork, or any other techniques you used to put your costume together, this category is for you!"
      url: "https://docs.google.com/forms/u/2/d/e/1FAIpQLScjD6TdRUmfWbg24yJiuwZ69Oabw0HtA5CQLGBjXr-o2ygVhQ/viewform?usp=publish-editor"
    - key: "performance"
      title: "Performance"
      image: "img/cosplay/category_performance.jpg"
      image_alt: "Performance category"
      description: "The Performance category will be judged based on stage presence, choreography, and how you bring your character to life! If you have a skit, dance, or stage act planned, this category is for you!"
      url: "https://forms.gle/YBKdNLMapMTwc2b36"
    - key: "exhibition"
      title: "Exhibition"
      image: "img/cosplay/category_exhibition.jpg"
      image_alt: "Exhibition category"
      description: "The Exhibition category is for anyone that wants a chance to walk across the stage, but doesn’t want to compete. This is just for fun and is NOT eligible for prizes, so there are no limits to whether you’ve made your costume yourself or not. Anyone may participate in this category, including staff and guests."
      url: "https://forms.gle/C1iSnHZ3fKakg2f3A"
  details:
    - key: "craftsmanship"
      heading: "More about Craftsmanship:"
      description: "The Craftsmanship category will be judged based on how well you’ve made your costume. If you’re proud of your sewing, foamwork, or any other techniques you used to put your costume together, this category is for you! You’ll have time before the contest to meet with the judges so they can see your work up close and ask any questions. During the contest, you’ll walk across the stage and strike some cool poses in front of the audience!"
      awards_bar: "Awards:"
      prize_label: "Prize:"
      link_label: "See more info"
      awards:
        - title_line1: "Best Craftsmanship"
          prize_prefix: "Free TouhouFest"
          prize_suffix: "Badge + Medal"
          desc_prefix: "This prize is awarded to the participant of the "
          desc_bold: "Craftsmanship Contest"
          desc_suffix: " whose work and effort crafting their costume left the strongest impression of the judges."
          url: "#awards"
        - title_line1: "Runner-up "
          title_line2: "Best Craftsmanship"
          prize_prefix: "Free TouhouFest"
          prize_suffix: "Badge + Medal"
          desc_prefix: "This prize is awarded to the participant of the "
          desc_bold: "Craftsmanship Contest"
          desc_suffix: " whose work and effort crafting their costume greatly impressed the judges."
          url: "#awards"
        - title_line1: "Judge's Choice Awards"
          prize: "Prizes TBD"
          desc_prefix: "Each judge will give an award to a contestant from either contest based on their own personal criteria."
          url: "#awards"
    - key: "performance"
      heading: "More about Performance:"
      description: "The Performance category is judged on stage presence, choreography, and storytelling. Handmade, store-bought, or commissioned costumes are all welcome—what matters is how you bring your character to life on stage in front of the judges and audience!"
      awards_bar: "Awards:"
      prize_label: "Prize:"
      link_label: "See more info"
      awards:
        - title_line1: "Best Performance"
          prize_prefix: "Free TouhouFest"
          prize_suffix: "Badge + Medal"
          desc_prefix: "This prize is awarded to the participant of the "
          desc_bold: "Performance Contest"
          desc_suffix: " whose stage presence and performance left the strongest impression on the judges."
          url: "#awards"
        - title_line1: "Runner-up "
          title_line2: "Best Performance"
          prize_prefix: "Free TouhouFest"
          prize_suffix: "Badge + Medal"
          desc_prefix: "This prize is awarded to the participant of the "
          desc_bold: "Performance Contest"
          desc_suffix: " whose stage presence and performance greatly impressed the judges."
          url: "#awards"
        - title_line1: "Judge's Choice Awards"
          prize: "Prizes TBD"
          desc_prefix: "Each judge will give an award to a contestant from either contest based on their own personal criteria."
          url: "#awards"
  itinerary:
    status: "coming_soon"
    heading: "Itinerary"
    items:
      - title: "Pre-Judging"
        day: "TBA"
        time: "TBA"
        description: "Preliminary judging at the Drawing & Painting Studio for Craftsmanship Contest participants prior to the main event."
      - title: "Seating"
        day: "TBA"
        time: "TBA"
        description: "Seating for the Cosplay Contest at the Torino Plaza main stage."
      - title: "Masquerade"
        day: "TBA"
        time: "TBA"
        description: "Main stage showcase of Craftsmanship, Performance, and Exhibition entries at Torino Plaza."
  note: "Those with any further questions related to cosplay events at TouhouFest are encouraged to visit either the Cosplay Ambassadors booth or the Touhou Cosplay Guild booth, both of which are located at the Toyota Meeting Hall."

guests:
  status: "coming_soon"
  title: "Cosplay Guests"
  divider_image: "img/cosplay/divider_guests.jpg"
  items:
    - role: "Cosplay Guest Judge"
      name: "Tororo"
      image: "img/cosplay/guest_tororo.png"
      bio: "Tororo is a cosplayer who has been active in the Touhou Project scene for over 17 years, and she is one of the most dedicated fans of Touhou. All of her costumes are self-made, and she excels at creating intricate and vibrant designs that capture the charm of the characters and the essence of their lore. To date, she has created over 100 Touhou Project costumes and continues to be actively involved in the scene."
      links:
        - label: "Twitter"
          url: "https://x.com/hoshibakoWorks"
    - role: "Cosplay Judge"
      name: "Purple Uniphants"
      image: "img/cosplay/guest_uni.png"
      bio: "You can call me Uni! I’ve been cosplaying since 2011, and I ventured into Touhou shortly after. I have a handful of awards under my belt, but please don’t be intimidated: I love seeing how we as cosplayers bring fiction to reality with our own styles and personalities. I owe all of my crafting knowledge to the internet, but I’m still not done learning!"
      links:
        - label: "Instagram"
          url: "https://www.instagram.com/purpleuniphants/"
        - label: "Twitter"
          url: "https://x.com/purpleuniphants"
    - role: "Cosplay Ambassador"
      name: "Pumpking"
      image: "img/cosplay/guest_pumpking.png"
      bio: "Hello, my name is Pumpking! I’m an Indiana native who’s been cosplaying Touhou Project since 2020. I love being a part of this community and recently have been making my own cosplays. I am also very passionate about making cosplay purchasing more accessible for others. If you need any help purchasing a premade cosplay online, I’m your gal! I have attended TouhouFest for all running years and performed during TouhouFest 2024 and MCed for TouhouFest 2025. I’m happy to be back for TouhouFest 2026 to judge and see you all again!"
      links:
        - label: "Instagram"
          url: "https://www.instagram.com/sunnysiddedup/"
        - label: "Twitter"
          url: "https://x.com/Sunnysiddedup"
    - role: "Master of Ceremonies"
      name: "patisseriepop"
      image: "img/cosplay/guest_patisseriepop.png"
      bio: "I’m MeduKitty, a long time cosplayer and Touhou enthusiast who’s thrilled to combine her two greatest passions! I’ve been cosplaying from Touhou since 2018, and my favorite thing is making my costumes from scratch with as many details as I can fit into them. I love our community so much and I can’t wait to participate in TouhouFest with you all!"
      links:
        - label: "Instagram"
          url: "https://www.instagram.com/medukitty_/"
        - label: "Tiktok"
          url: "https://www.tiktok.com/@medukitty"
        - label: "Twitter"
          url: "https://twitter.com/medukitty"

