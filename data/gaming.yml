  title: "Tabletop"
  location: "George Nakano Theatre"
  description: "TouhouFest is pleased to offer a dedicated section for tabletop gaming this year! Inside the Drawing & Painting Studio ( Tabletop & Mystery Parafait) two tables are available for free-play, and two tables are reserved for games specifically for [\"Danmaku!!\"](https://danmaku.party), the hit Touhou-themed tabletop card game. Feel free to stop by for some engaging tabletop gaming!"
