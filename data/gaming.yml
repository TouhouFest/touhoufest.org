hero:
  title: "Gaming"
  image: "/img/gaming/hero_gaming.jpg"

intro:
  text: "Gaming events for\u00a0official\u00a0Touhou games, tournaments, and arcade cabinets will take place in the\u00a0George Nakano Theatre (Gaming Hall) located to the right of the Entry Plaza. Fangames and Tabletop Gaming (including Danmaku!!) are located in the\u00a0Assembly Hall."

freeplay_divider:
  title: "Free Play"

fangames:
  title: "Fangames"
  location: "Assembly Hall"
  description_prefix: "Touhou mainline games, fighting games, spinoffs, and select fangames will be playable at various times throughout the con, as marked by events labelled as \"Free Play\". Assistance is graciously provided by\u00a0"
  partner_name: "Youkaiverse"
  partner_url: "https://twitter.com/Youkaiverse"
  description_suffix: "; we thank them for their assistance this year."
  items:
    - overline: "Noetic Nightjar Studio"
      title: "Touhou ~ Dreams of a Sunflower"
      image: "/img/gaming/fangame_1.jpg"
      location: "Assembly Hall"
      link_label: "Dev Link"
      link_url: "http://noeticnightjar.com"
    - overline: "Ice Fall Creative"
      title: "Touhou Danmaku Maze"
      image: "/img/gaming/fangame_2.jpg"
      location: "Assembly Hall"
      link_label: "Dev Link"
      link_url: "https://store.steampowered.com/app/2927320/Touhou_Danmaku_Maze/"
    - overline: "Fire Land"
      title: "Touhou Lensed Night Sky"
      image: "/img/gaming/fangame_3.jpg"
      location: "Assembly Hall"
      link_label: "Dev Link"
      link_url: "https://store.steampowered.com/app/1825250/Touhou_Lensed_Night_Sky_Kaseigai/"

arcade:
  title: "Arcade Cabinets"
  location: "George Nakano Theatre"
  image: "/img/gaming/arcade_cabinets.jpg"
  button_label: "Arcade Info"
  description: "A variety of different arcade cabinets and rhythm games will be available to play throughout TouhouFest. Below is a selection of some of the offerings:"
  top_cabinet: "Dance Dance Revolution"
  bottom_cabinets:
    - "Trouble Witches"
    - "Tetris Grand Master 3"

tabletop:
  title: "Tabletop"
  location: "Assembly Hall"
  description_prefix: "TouhouFest is pleased to offer a dedicated section for tabletop gaming this year! Inside the\u00a0Assembly Hall, tables are available for free-play and for games specifically for "
  game_quote: "\""
  game_name: "Danmaku!!"
  game_url: "https://danmaku.party/"
  description_suffix: ", the hit Touhou-themed tabletop card game. Feel free to stop by for some engaging tabletop gaming!"
  items:
    - overline: "Mystery Parfait"
      title: "Danmaku!!"
      image: "/img/gaming/tabletop_1.jpg"
      location: "Assembly Hall"
      link_label: "Visit Site"
      link_url: "https://danmaku.party/"
    - overline: "tboddy"
      title: "Burning Spirit"
      image: "/img/gaming/tabletop_2.jpg"
      location: "Assembly Hall"
      link_label: "Dev Link"
      link_url: "http://tboddy.itch.io"
    - overline: "Tabletop Free-Play"
      title: "Card & Board Games"
      image: "/img/gaming/tabletop_3.jpg"
      location: "Assembly Hall"
      link_label: "Danmaku!! Rules"
      link_url: "https://danmaku.party/"

competitions_divider:
  title: "Competitions"
  p1: "Tournaments are being arranged for the below games. Tournament rules for each game are attached below which lead to start.gg."
  p2: "Sign-ups for gaming tournaments at TouhouFest close on"
  p3_prefix: "Those interested may visit\u00a0"
  p3_link_text: "TouhouFest's start.gg page for more information"
  p3_link_dot: "."
  p3_url: "https://www.start.gg/tournament/touhoufest-2026/details"
  button_label: "Sign Up"
  button_url: "https://www.start.gg/tournament/touhoufest-2026/details"

