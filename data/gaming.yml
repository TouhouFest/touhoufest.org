location_intro: "Gaming events for official Touhou games will take place in the George Nakano Theatre, (Gaming Hall) located to the right of the Entry Plaza. Arcades are located at the Ken Miller Rec Center ( Arcade Cabinets) next to the Torino Festival Plaza. Tabletop Gaming is located in the Drawing & Painting Studio ( Tabletop Gaming & Mystery Parafait) at the tail end of the Pine Wind Garden."

