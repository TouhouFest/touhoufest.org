  description_prefix: "TouhouFest is pleased to offer a dedicated section for tabletop gaming this year! Inside the\u00a0Drawing & Painting Studio\u00a0(\u00a0Tabletop & Mystery Parfait) two tables are available for free-play, and two tables are reserved for games specifically for "
  game_quote: "\""
  game_name: "Danmaku!!"
  game_url: "https://danmaku.party/"
  description_suffix: ", the hit Touhou-themed tabletop card game. Feel free to stop by for some engaging tabletop gaming!"
