hero:
  title: "Gaming"
  image: "/img/gaming/hero_gaming.jpg"

intro:
  text: "Gaming events for\u00a0official\u00a0Touhou games will take place in the\u00a0George Nakano Theatre, (Gaming Hall) located to the right of the Entry Plaza. Arcades are located at the\u00a0Ken Miller Rec Center\u00a0(\u00a0Arcade Cabinets) next to the Torino Festival Plaza. Tabletop Gaming is located in the\u00a0Drawing & Painting Studio\u00a0(\u00a0Tabletop Gaming & Mystery Parfait) at the tail end of the Pine Wind Garden."

