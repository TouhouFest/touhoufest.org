guide:
  id: "about-touhou"
  tag: "SERIES OVERVIEW"
  title: "What is Touhou Project?"
  lead: "What makes Touhou Project so special is the unending fan passion for its characters, unforgettable music, and an extraordinarily creative global doujin community spanning nearly three decades. Originating in 1996 as a series of <em>danmaku</em> (curtain-fire bullet hell) shoot 'em up games, mainline Touhou is conceived, programmed, illustrated, and composed by <strong>one creator: ZUN</strong>."
  body: "Set in <strong>Gensokyo</strong>—a mystical realm sealed off from the outside world by the Great Hakurei Barrier where humans, gods, and youkai coexist—the series follows shrine maiden Reimu Hakurei, magician Marisa Kirisame, and a cast of over 180 characters resolving supernatural incidents under the <strong>Spell Card rules</strong>, turning duels into dazzling, non-lethal choreography of geometric bullet patterns."
  stats:
    - value: "1996 – Present"
      label: "Continuous Era Span"
    - value: "30+ Official Titles"
      label: "Mainline & Spin-Offs"
    - value: "Global Doujin Hub"
      label: "Music, Art & Fangames"
  figure:
    image: "img/EoSD_Screenshot.jpg"
    alt: "Danmaku Spell Card pattern in Touhou 6: Embodiment of Scarlet Devil"
    caption: "Spell Card danmaku in <em>Touhou 6: Embodiment of Scarlet Devil</em>"

zun:
  id: "zun"
  image: "img/IMG_0145 ZUN.jpg"
  image_alt: "ZUN (Team Shanghai Alice)"
  tag: "CREATOR SPOTLIGHT"
  title: "ZUN (Team Shanghai Alice)"
  subtitle: "Musician, Programmer, Writer, Designer & Sole Member of Team Shanghai Alice"
  paragraphs:
    - "Jun'ya Ota—universally known as <strong>ZUN</strong>—debuted the Touhou series on the NEC PC-9801 while studying at Tokyo Denki University, releasing <em>Highly Responsive to Prayers</em> in 1996 through Amusement Makers. In 2002, he founded his one-man circle <strong>Team Shanghai Alice</strong> and launched <em>Embodiment of Scarlet Devil</em>, beginning the modern Windows era."
    - "ZUN's famously open derivative-work guidelines empowered independent creators everywhere to compose arrangements, draw manga, animate PVs, and publish Touhou fangames—building the most prolific fan-driven ecosystem in gaming history."
  buttons:
    - label: "ZUN's Website"
      url: "https://www16.big.or.jp/~zun/"
    - label: "Follow @korindo"
      url: "https://x.com/korindo"

starter_recommendations:
  id: "entry-points"
  title: "Recommended Entry Points"
  subtitle: "New to Touhou? Community veterans recommend starting with any of these approachable Windows-era titles."
  cards:
    - image: "img/Th07cover.jpg"
      alt: "Touhou 7 cover"
      tag: "BEST FIRST GAME"
      era: "Windows Era • Bullet Hell"
      title: "Touhou 7: Perfect Cherry Blossom"
      desc: "Features the automatic Supernatural Border shield system, visible focused hitboxes, iconic music, and three distinct playable heroines (Reimu, Marisa, and Sakuya)."
    - image: "img/Th08cover.jpg"
      alt: "Touhou 8 cover"
      tag: "FORGIVING MECHANICS"
      era: "Windows Era • Partner Teams"
      title: "Touhou 8: Imperishable Night"
      desc: "Pairs four human-and-youkai teams with generous deathbomb windows and a dedicated Spell Practice mode to master individual boss patterns at your own pace."
    - image: "img/Th10cover.jpg"
      alt: "Touhou 10 cover"
      tag: "STREAMLINED CLASSIC"
      era: "Windows Era • Available on Steam"
      title: "Touhou 10: Mountain of Faith"
      desc: "Ushered in the second-generation Windows engine with clean mechanics where bombs draw directly from shot power, rewarding bold resource routing."
    - image: "img/Th13cover.jpg"
      alt: "Touhou 13 cover"
      tag: "ACCESSIBLE MODERN"
      era: "Windows Era • Spirit Trance"
      title: "Touhou 13: Ten Desires"
      desc: "Gentle bullet density paired with a Divine Spirit Trance gauge for temporary invulnerability and built-in Spell Practice right from the main menu."
    - image: "img/Th18cover.jpg"
      alt: "Touhou 18 cover"
      tag: "CUSTOMIZABLE DECK"
      era: "Windows Era • Ability Cards"
      title: "Touhou 18: Unconnected Marketeers"
      desc: "Shop between stages for Ability Cards granting extra lives, defensive auto-guards, and iconic boss weapons tailored to any skill level."

