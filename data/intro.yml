guide:
  id: "about-touhou"
  title: "What is Touhou Project?"
  paragraphs:
    - "What makes Touhou Project so special is the unending fan passion for its characters, unforgettable music, and an extraordinarily creative global doujin community spanning nearly three decades. Originating in 1996 as a series of <em>danmaku</em> (curtain-fire bullet hell) shoot 'em up games, mainline Touhou is conceived, programmed, illustrated, and composed by <strong>one creator: ZUN</strong>."
    - "Set in <strong>Gensokyo</strong>—a mystical realm sealed off from the outside world by the Great Hakurei Barrier where humans, gods, and youkai coexist—the series follows shrine maiden Reimu Hakurei, magician Marisa Kirisame, and a cast of over 180 characters resolving supernatural incidents under the <strong>Spell Card rules</strong>, turning duels into dazzling, non-lethal choreography of geometric bullet patterns."
  image: "img/EoSD_Screenshot.jpg"
  image_alt: "Danmaku Spell Card pattern in Touhou 6: Embodiment of Scarlet Devil"
  button_label: "Explore TouhouFest"
  button_path: "@/_index.md"

zun:
  id: "zun"
  title: "ZUN (Team Shanghai Alice)"
  subtitle: "Musician, Programmer, Writer, Designer & Sole Member of Team Shanghai Alice"
  image: "img/IMG_0145 ZUN.jpg"
  image_alt: "ZUN (Team Shanghai Alice)"
  paragraphs:
    - "Jun'ya Ota—universally known as <strong>ZUN</strong>—debuted the Touhou series on the NEC PC-9801 while studying at Tokyo Denki University, releasing <em>Highly Responsive to Prayers</em> in 1996 through Amusement Makers. In 2002, he founded his one-man circle <strong>Team Shanghai Alice</strong> and launched <em>Embodiment of Scarlet Devil</em>, beginning the modern Windows era."
    - "ZUN's famously open derivative-work guidelines empowered independent creators everywhere to compose arrangements, draw manga, animate PVs, and publish Touhou fangames—building the most prolific fan-driven ecosystem in gaming history."
  button_label: "ZUN's Website"
  button_url: "https://www16.big.or.jp/~zun/"

