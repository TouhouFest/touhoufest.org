days:
  - id: "day-1"
    key: "fri"
    day_name: "Friday"
    day: "Day 1"
    title: "Day 1: Friday, June 19"
    date: "Friday, June 19, 2026"
    hours: "3:00 PM - 8:00 PM"
    summary: "Pre-registration badge pickup, Friday cosplay photoshoot, Maid Academy Cafe Picnic Plaza, evening panels, and TouhouFest Discord Game Night."
    events:
      - time: "3:00 PM - 8:00 PM"
        title: "Pre-Reg Pick Up"
        room: "Torrance Cultural Arts Center"
        category: "Con Ops"
        description: "Badge Pre-Reg Pick Up + a chance to meet and get to know fellow con-goers."
      - time: "4:00 PM - 4:45 PM"
        title: "To Be Announced"
        room: "Pine Wind Garden"
        category: "Cosplay Photoshoot"
        characters: "Please wait warmly!"
        description: "We are preparing the cosplay schedule for 2027!"
      - time: "4:15 PM - 4:45 PM"
        title: "Maid Academy Cafe's Picnic Plaza (Session 1)"
        room: "Torino Plaza"
        category: "Guest"
        description: "Maid Academy brings an interactive outdoor mini cafe experience featuring Touhou-themed maids, fresh food and drinks, games, performances, and plenty of Touhou-inspired music."
      - time: "4:30 PM - 5:15 PM"
        title: "Tactical Touhou: A Look at Military-themed Touhou Works"
        room: "Drawing & Painting Studio"
        category: "Panels"
        description: "A look at fanart, doujins, fangames, and cosplays of militarized Touhou characters throughout the years, along with canon references in official works to armed conflict."
      - time: "5:00 PM - 8:00 PM"
        title: "TouhouFest Discord Game Night @ TCAC!"
        room: "Torino Plaza"
        category: "Gaming"
        description: "Our monthly Discord-hosted multiplayer game night brought on location, featuring Mario Kart 8 Deluxe, Mario Kart World, and more!"
      - time: "5:30 PM - 6:45 PM"
        title: "The Art of Danmaku: The Basics of Touhou Game Mechanics and Elegant Danmaku Patterns"
        room: "Drawing & Painting Studio"
        category: "Panels"
        description: "Explore the process of making a Touhou game and constructing bosses and elegant danmaku patterns using accessible high-school mathematics."
      - time: "6:05 PM - 7:35 PM"
        title: "Maid Academy Cafe's Picnic Plaza (Session 2)"
        room: "Torino Plaza"
        category: "Guest"
        description: "Maid Academy brings an interactive outdoor mini cafe experience featuring Touhou-themed maids, fresh food and drinks, games, performances, and plenty of Touhou-inspired music."
      - time: "7:00 PM - 7:45 PM"
        title: "Gensokyo Geography 101: or How I Learned to Stop Worrying and Love Speculation"
        room: "Drawing & Painting Studio"
        category: "Panels"
        description: "A primer and presentation on the possible 'where' and 'what' of various popular locations around Gensokyo, as well as sourced speculation on the original formation of Gensokyo."

  - id: "day-2"
    key: "sat"
    day_name: "Saturday"
    day: "Day 2"
    title: "Day 2: Saturday, June 20"
    date: "Saturday, June 20, 2026"
    hours: "9:00 AM - 11:00 PM"
    summary: "Opening ceremonies, Artist Alley & Vendors, Gaming Hall tournaments, themed cosplay photoshoots, Cosplay Contest, cosplay workshops, and TouhouFest LIVE Concert."
    events:
      - time: "9:00 AM"
        title: "Doors Open (Saturday)"
        room: "Torrance Cultural Arts Center"
        category: "Con Ops"
        description: "TouhouFest's Saturday start time is 9:00 AM."
      - time: "9:00 AM - 6:00 PM"
        title: "Artist Alley & Vendors Open (Saturday)"
        room: "Toyota Meeting Hall"
        category: "Exhibition"
        description: "Come visit Artist Alley & Vendors and purchase a variety of prints, charms, and other fanworks!"
      - time: "9:00 AM - 9:00 PM"
        title: "Gaming Hall Free Play (Saturday)"
        room: "George Nakano Theatre"
        category: "Gaming"
        description: "Free play of all the official Touhou games, arcade games, and Touhou fan games!"
      - time: "9:00 AM - 10:00 AM"
        title: "Free Space for Unofficial Photoshoots & Meetups"
        room: "Pine Wind Garden"
        category: "Cosplay"
        description: "The Pine Wind Garden is available for free use during this timeslot."
      - time: "9:30 AM - 10:00 AM"
        title: "Check-In for Tournaments Wave A"
        room: "George Nakano Theatre"
        category: "Gaming"
        description: "Check-ins for Tournament Wave A (Hisoutensoku Pool 1 + PoFV Pool 1) at the George Nakano Theatre."
      - time: "9:45 AM - 10:15 AM"
        title: "Opening Ceremonies"
        room: "Torino Plaza"
        category: "Con Ops"
        description: "Welcome to TouhouFest! MikoTan and several others on TouhouFest staff will start things off with a few opening remarks."
      - time: "10:00 AM - 10:45 AM"
        title: "To Be Announced"
        room: "Pine Wind Garden"
        category: "Cosplay Photoshoot"
        characters: "Please wait warmly!"
        description: "We are preparing the cosplay schedule for 2027!"
      - time: "10:00 AM - 11:30 AM"
        title: "Cosplay Contest Pre-Judging"
        room: "Drawing & Painting Studio"
        category: "Cosplay"
        description: "Preliminary judging for Cosplay Contest participants prior to the main event. Only applicable to those who filled out the craftsmanship form for the cosplay competition."
      - time: "10:00 AM - 12:00 PM"
        title: "Tournaments: Wave A (Hisoutensoku Pool 1 & PoFV Pool 1)"
        room: "George Nakano Theatre"
        category: "Tournament"
        description: "Pools and brackets for Touhou 12.3 Hisoutensoku (Pool 1) and Touhou 9 PoFV (Pool 1)."
      - time: "10:00 AM - 5:00 PM"
        title: "Cosplay Repair (Saturday)"
        room: "Assembly Hall"
        category: "Cosplay"
        description: "Did your cosplay unexpectedly explode into a million billion pieces? TouhouFest has a dedicated Cosplay Repair stand available to assist."
      - time: "10:30 AM - 11:45 AM"
        title: "Fumology 104: The Fumoreckoning"
        room: "Children's Art Wing"
        category: "Panels"
        description: "Silly little plushies have taken over the world. Learn their tactics for global domination, how to stop scalpers, and earn your bachelor's degree in Fumology!"
      - time: "11:30 AM - 12:00 PM"
        title: "Check-In for Tournaments Wave B"
        room: "George Nakano Theatre"
        category: "Gaming"
        description: "Check-ins for Tournament Wave B (Rivals Pool 1 + PoFV Pool 2) at the George Nakano Theatre."
      - time: "11:45 AM - 12:45 PM"
        title: "Kamizuki"
        room: "Torino Plaza"
        category: "Performance"
        description: "Kamizuki is a J-rock/ACG band based in Los Angeles performing high-energy, rhythm-driven Japanese rock songs."
      - time: "12:00 PM - 12:45 PM"
        title: "Queering Gensokyo: Yuri in Fansokyo"
        room: "Children's Art Wing"
        category: "Panels"
        description: "The follow-on to last year's Queering Gensokyo, covering inter-cast yuri shipping across both the western and eastern sides of the Touhou fandom."
      - time: "12:00 PM - 2:00 PM"
        title: "Tournaments: Wave B (Rivals Pool 1 & PoFV Pool 2)"
        room: "George Nakano Theatre"
        category: "Tournament"
        description: "Pools and brackets for Rivals of Aether Touhou Workshop (Pool 1) and Touhou 9 PoFV (Pool 2)."
      - time: "12:30 PM - 1:15 PM"
        title: "Touhou and TTRPGs - Running a D20 Roleplaying Game in Gensokyo"
        room: "Drawing & Painting Studio"
        category: "Panels"
        description: "Two experienced Game Masters discuss adapting the world of Touhou to Pathfinder 2nd Edition and what makes a tabletop roleplaying campaign feel like Touhou."
      - time: "1:00 PM - 2:15 PM"
        title: "Beyond the Sonic Boundaries: Odd, Obscure, & Unorthodox Touhou Music"
        room: "Children's Art Wing"
        category: "Panels"
        description: "Discover new musical worlds in this showcase of underappreciated Touhou arrangement styles, unique circles, and doujin music scenes inside and outside Japan."
      - time: "1:30 PM - 2:00 PM"
        title: "Check-In for Tournaments Wave C"
        room: "George Nakano Theatre"
        category: "Gaming"
        description: "Check-ins for Tournament Wave C (Rivals Pool 2 + Hisoutensoku Pool 2) at the George Nakano Theatre."
      - time: "1:30 PM - 2:15 PM"
        title: "How to be good at Touhou (Wait. Touhou has a videogame!?)"
        room: "Drawing & Painting Studio"
        category: "Panels"
        description: "Learn the fundamentals of the official Touhou bullet-hell games and how to enjoy colorful, challenging danmaku patterns."
      - time: "2:00 PM - 4:00 PM"
        title: "Tournaments: Wave C (Rivals Pool 2 & Hisoutensoku Pool 2)"
        room: "George Nakano Theatre"
        category: "Tournament"
        description: "Pools and brackets for Rivals of Aether Touhou Workshop (Pool 2) and Touhou 12.3 Hisoutensoku (Pool 2)."
      - time: "2:30 PM - 3:45 PM"
        title: "Gensokyo You Can! Moriya Shrine: The Gateway to Touhou Pilgrimage"
        room: "Children's Art Wing"
        category: "Panels"
        description: "Explore the locale and culture around Lake Suwa that inspired the Moriya Shrine and its residents, fandom presences, and fanwork references."
      - time: "2:30 PM - 3:45 PM"
        title: "Touhou Cold Read Comedy Grand Prix!"
        room: "Drawing & Painting Studio"
        category: "Panels"
        description: "Teams of two or three compete in an improv and comedic acting gauntlet before a panel of five judges to advance to the grand finals!"
      - time: "2:45 PM - 3:00 PM"
        title: "Cosplay Contest Seating"
        room: "Torino Plaza"
        category: "Cosplay"
        description: "Seating for the Cosplay Contest at the Torino Plaza main stage."
      - time: "3:00 PM - 5:00 PM"
        title: "Cosplay Contest"
        room: "Torino Plaza"
        category: "Cosplay"
        description: "An amazing showcase of talented and creative Touhou cosplayers across Craftsmanship, Performance, and Exhibition categories!"
      - time: "3:00 PM - 5:00 PM"
        title: "Free Space for Unofficial Photoshoots & Meetups"
        room: "Pine Wind Garden"
        category: "Cosplay"
        description: "The Pine Wind Garden is available for free use during this timeslot."
      - time: "3:00 PM - 6:00 PM"
        title: "Tournaments: Top 4 PoFV"
        room: "George Nakano Theatre"
        category: "Tournament"
        description: "Top 4 championship finals for Touhou 9: Phantasmagoria of Flower View."
      - time: "4:00 PM - 5:15 PM"
        title: "Touhou Jeopardy"
        room: "Drawing & Painting Studio"
        category: "Panels"
        description: "So you think you know Touhou? Put your knowledge of the series and fandom to the test in this interactive game show!"
      - time: "4:00 PM - 5:45 PM"
        title: "20th Touhou M-1 Grand Prix Screening"
        room: "Children's Art Wing"
        category: "Screening"
        description: "The monumental 20th installment of the long-running Touhou manzai comedy show featuring 5 duos and 7 performances with full English subtitles!"
      - time: "5:00 PM - 7:00 PM"
        title: "Tournaments: Top 4 Rivals"
        room: "George Nakano Theatre"
        category: "Tournament"
        description: "Top 4 championship finals for Rivals of Aether Touhou Workshop."
      - time: "5:30 PM - 6:00 PM"
        title: "TouhouFest LIVE Concert Seating & Ticketing"
        room: "James Armstrong Theatre"
        category: "Concert"
        description: "Seating and free ticket check-in for the TouhouFest LIVE Concert at the James Armstrong Theatre."
      - time: "6:00 PM - 7:00 PM"
        title: "Cosplay Workshop: Sewing"
        room: "Children's Art Wing"
        category: "Workshop"
        description: "Guided tutorial on approaching a sewing project: selecting fabrics and a sewing machine, identifying garments for Touhou characters, patterning from measurements, and live sewing machine demonstrations."
      - time: "6:00 PM - 9:00 PM"
        title: "TouhouFest LIVE Concert"
        room: "James Armstrong Theatre"
        category: "Concert"
        description: "Join us at the James Armstrong Theatre as COOL&CREATE's beatMARIO, IOSYS's Maron, Tokyo Active NEETs' Akai Ryu-sei, and YaboiMatoi perform live on stage!"
      - time: "6:00 PM - 10:00 PM"
        title: "Free Space for Unofficial Photoshoots & Meetups"
        room: "Pine Wind Garden"
        category: "Cosplay"
        description: "The Pine Wind Garden is available for free use during this timeslot."
      - time: "7:00 PM - 8:00 PM"
        title: "Cosplay Workshop: Props, Wigs & Makeup"
        room: "Children's Art Wing"
        category: "Workshop"
        description: "Guided tutorial on handling the non-dress aspects of your cosplay: working with EVA foam and prop-making materials, painting props, wig basics and live cutting demonstrations, and cosplay makeup fundamentals."
      - time: "7:00 PM - 9:00 PM"
        title: "Tournaments: Top 4 Hisoutensoku"
        room: "George Nakano Theatre"
        category: "Tournament"
        description: "Top 4 championship finals for Touhou 12.3: Hisoutensoku."
      - time: "8:00 PM - 9:00 PM"
        title: "Cosplay Workshop: Photography"
        room: "Children's Art Wing"
        category: "Workshop"
        description: "Guided tutorial on capturing great cosplay photos: how to pose well as a subject, set up lighting and backdrops, choose camera equipment, and edit cosplay photos."
      - time: "9:00 PM - 10:30 PM"
        title: "TouhouFest LIVE Meet & Greet"
        room: "Entry Foyer (Ken Miller Rec Center)"
        category: "Guest"
        description: "Meet the featured guests from the TouhouFest LIVE Concert and get autographs (one item per autograph)."
      - time: "11:00 PM"
        title: "Doors Close (Saturday)"
        room: "Torrance Cultural Arts Center"
        category: "Con Ops"
        description: "TouhouFest closes for the night. See you again on Sunday!"

