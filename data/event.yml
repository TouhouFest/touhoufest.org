hero:
  title: "What is TouhouFest?"
  p1: "TouhouFest is a convention run by Touhou Fans, for Touhou Fans.  It is held at the Torrance Cultural Arts Center in Torrance, California. Touhou fans from across the country will gather to celebrate the coming season and enjoy all the Touhou community has to offer such as art, music, and more!"
  p2: "Enjoy the festival yourself with joyous music at the Touhou concerts, merry games at our gaming hall, magnificent art from our artist alley, and delicious food! Wear your cosplays for a stroll along the backdrop of the beautiful Pine Wind Japanese Garden and the festival games in the plaza. We invite you to come yonder from the human village while the Youkai are distracted with merriment, and enjoy all the wonders Gensokyo has to offer!"
  desktop_image: "img/event/hero_event.png"
  mobile_image: "img/event/hero_event_mobile.png"

