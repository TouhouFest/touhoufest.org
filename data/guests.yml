featured_section:
  title: "Guests"

featured:
  - role: "Tokyo Active NEETs"
    name: "Akai Ryu-sei"
    avatar: "/img/guests/featured_akai_ryusei.png"
    bio_paragraphs:
      - "Akai Ryusei is a Japan-based multi-creator who masters jazz, rock, and chiptune. With impressive piano technique and skillful self-production, he delivers worldwide a truly one-of-a kind sound born from game music roots."
      - "紅維流星は、日本を拠点にジャズ、ロック、チップチューンを自在に操るマルチクリエイター。圧巻のピアノと高度なセルフプロデュースで、ゲーム音楽をルーツにした唯一無二のサウンドを世界へ届けている。"
    socials:
      - platform: "instagram"
        label: "Instagram"
        url: "https://www.instagram.com/"
      - platform: "tiktok"
        label: "Tiktok"
        url: "https://www.tiktok.com/"
      - platform: "twitter"
        label: "Twitter"
        url: "https://x.com/akairyusei"
  - role: "Guitarist"
    name: "YaboiMatoi"
    avatar: "/img/guests/featured_yaboimatoi.png"
    bio_paragraphs:
      - "YaboiMatoi comes to TouhouFest to perform his first ever concert for you!  "
      - "YaboiMatoi (Fabian Fach) is a Polish-German guitarist, singer and producer creating metal covers of Touhou, Vocaloid, anime and meme songs. He's worked with fellow creators like RichaadEB, MTB and Jonathan Young. "
      - " Having two Touhou Metal albums (Youkai & Lunatic) and over 10 million YouTube views under his belt, YaboiMatoi is now bringing you your favorite Touhou songs live on stage."
    socials:
      - platform: "instagram"
        label: "Instagram"
        url: "https://www.instagram.com/yaboimatoi"
      - platform: "tiktok"
        label: "Tiktok"
        url: "https://www.tiktok.com/@yaboimatoi"
  - role: "Band"
    name: "YONA"
    avatar: "/img/guests/featured_yona.png"
    bio_paragraphs:
      - "Body copy goes here. Lorem ipsum dolor sit amet consectetur adipiscing elit Ut et massa mi. Aliquam in hendrerit urna. Pellentesque sit amet sapien fringilla, mattis ligula consectetur, ultrices mauris. Maecenas vitae mattis tellus..Lorem ipsum dolor sit amet consectetur adipiscing elit Ut et massa mi."
    socials:
