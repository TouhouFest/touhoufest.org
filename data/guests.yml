  title: "DJs & Performers"

performers:
  - name: "Kamizuki"
    image: "/img/guests/perf_1.png"
    label: "J-rock and ACG band based in Los Angeles performing high-energy, rhythm-driven Japanese rock arrangements live on stage."
  - name: "DJ Halica"
    image: "/img/guests/perf_2.png"
    label: "DFW-based DJ spinning high-energy Touhou drum and bass sets with a mix of crowd-pleasers and underground tracks."
  - name: "Neo Sanctum"
    image: "/img/guests/perf_3.png"
    label: "Live instrumental ensemble performing chamber, violin, and brass arrangements of classic Touhou Project soundtracks."
  - name: "AfterGlow"
    image: "/img/guests/perf_4.png"
    label: "Live outdoor jam sessions and electronic Touhou arrangements performed at the Torino Festival Plaza stage."
  - name: "Gensou Hard Dancers"
    image: "/img/guests/perf_5.png"
    label: "Shuffle and jumpstyle dance group bringing high-energy choreography to fan-favorite Touhou arrangements."
  - name: "Maid Academy Cafe"
    image: "/img/guests/perf_6.png"
    label: "Interactive cafe and stage troupe charming audiences with music, dance, and character-driven Touhou performances."
