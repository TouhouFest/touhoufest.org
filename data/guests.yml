featured:
  - name: "A-One Records"
    role: "Featured Guest"
    image: "/img/a-one.jpg"
    bio: "The Touhou Eurobeat Masters are back for TouhouFest! Founded by Yassie and ELEMENTAS in 2008, producing the legendary TOHO EUROBEAT, SUPER EURO SMASH, and EUROBEAT ATTACK!! album series."
    url: "https://lit.link/en/aonejp"
  - name: "TAMUSIC"
    role: "Featured Guest"
    image: "/img/TAM.JPG"
    bio: "Run by head musician TAM, TAMUSIC is the world's most prolific Doujin music circle, composing with 30 different instruments and producing over 2,000 rearrange tracks worldwide."
    url: "https://twitter.com/tamusic"

