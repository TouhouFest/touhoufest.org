2025:
- name: SHIHORI
  desc: |
    SHIHORI is a J-pop singer/songwriter based in LA.

    She’s best known for “Holy Steel,” a fan theme for “Jojo’s Bizarre Adventure,” and the theme songs for popular games such as League of Legends, Omega Strikers, Brawl Stars, Cold of War, beatmania ⅡDX and Initial D The Arcade.

    She’s also known as a former member of “SOUND HOLIC” and “A-One” in Touhou Project Doujin industry. 

    She has written and composed over 130 songs for J-pop artists such as Nana Mizuki and Momoiro Clover Z, and for such famed anime shows as Fairy Tail, My Little Pony, Ultraman R/B, Tomodachi Game, Macross Frontier and The Irregular at Magic High School besides her original works. 
    [Website](//www.shihoriartist.com/)
- name: A-One Records
  desc: |
    The Touhou Eurobeat Masters are back for their second year! 

    A-One was founded by Yassie and ELEMENTAS in 2008, A-One Records has since then become a household name in the Touhou remix and Eurobeat scenes alike, producing the TOHO EUROBEAT, SUPER EURO SMASH and EUROBEAT ATTACK!! album series.

    A-ONE Records will be performing a live concert starring ELEMENTAS, Rute and Aki, truly an experience that must be seen to be believed!
    [Links](//lit.link/en/aonejp)
- name: TAMusic
  desc: |
    Coming back for a third year, please give a warm welcome back to the talented musicians of TAMusic!

    Music circle TAMUSIC is run by its head musician TAM and is the world's most prolific and largest Doujin music circle. He is capable of improvising any song he has listened to, and composes music that plays with 30 different types of instruments. Currently the world's first publisher of Touhou Ensou Douga (東方演奏動画).

    Since 2004, his Youtube channel has reached 120k subscribers, 60 million replays, and he has released 192 Touhou doujin music CDs, produced over 2000 rearrange music tracks, and traveled across the world and performed in 20 different locations across Asia, North America, and Europe.

    Socials:

    twitter: @tamusic
    IG: @tam.tamusic
    [Links](//twitter.com/tamusic)
- name: Miko
  desc: |
    From August 2004, working as a freelance vocalist and voice provider. 
    From May 2022, the special tourism ambassador for Choshi City, Chiba Prefecture,Japan. 

    miko's name became widely known as music circle "IOSYS"'s Touhou arrangements such as "Marisa Stole Something Precious," "Cirno's Perfect Math Class," and "Scarlet Police Ghetto Patrol 24 Hours" became popular on video sites. Since then, she has been active as a vocalist in a wide range of fields, both commercial and doujin, singing songs for major companies' web commercials, game music, game character image songs, and TV program theme songs. She also has a wide range of activities outside of singing, such as appearing in visual videos, voice acting, radio personality, and stage performances. 

    Her main occupation is systems engineering.
    [Click Here](//miko-nyu.booth.pm/)
- name: Suzukannn
  desc: |
    Suzukannn is a dedicated and very talented illustrator who draws a litany of Touhou artworks and fanworks. Her work has been featured as part of collaborations with a variety of big Touhou names such as BeatMARIO, Shinra-Bansho, and Reitaisai!
    [Click Here](//x.com/suzukannn)
- name: Hakurei Shrine Office
  desc: |
    Greetings, we are the Hakurei Shrine Reitaisai, a Touhou-only event focused on Touhou Project and its fandom. Hosted by the Hakurei Shrine Office, our event is hosted twice each year, in Spring and Fall, at Tokyo Big Sight. Please come and visit us for the biggest gathering of Touhou fans!
    [Click Here](//reitaisai.com/)
2024:
- name: Punderfullll
  desc: |
    I’m Punderful! I’m a Canadian cosplayer and streamer! I started cosplaying in 2006 and it has been a huge passion and hobby of mine ever since. I discovered Touhou Project in 2009 and started to cosplay from it in 2013. Touhou is one of my favorite game series and has been a huge part of my life. I currently stream on Twitch 5 days a week, and have been challenging myself to beat Touhou games  with a Pop’n Music controller!

    I’m so happy and thankful to be invited back again for next year. I cannot wait to see everyone again at Touhoufest 2024!
    [Linktree](//linktr.ee/punderfullll)
- name: Shihori
  desc: |
    SHIHORI is an international J-pop singer and songwriter based in LA who composes and performs solo work, as well as music for film, TV, anime, and games. 

    She's best known for the theme songs of League of Legends, Omega Strikers, and her featured songs in franchises like PUBG and beatmania IIDX. 

    She's also known for being one of the first doujin industry singers for Touhou Project as a former member of "SOUND HOLIC" and "A-One". 

    After many of her releases have made the Oricon Chart in Japan with 13 of her hits having attained Gold Disc Certification, in 2018 she moved to the U.S.
    [Linktree](//linktr.ee/shihorimusic)
- name: Renko
  desc: |
    Renko is a formerly Tokyo-based vocalist and lyricist, from California who has been a part of many different Touhou arrange and original music circles. She is the founder, vocalist, and lyricist for ORANGE★JAM, as well as the English lyricist for FELT.  

    Inspired by the creative nature, music, characters, and stories of Touhou Project, Renko started her own Touhou arrange music circle, ORANGE★JAM, at Comiket 81 (2011), one of the first native English, international Touhou arrange circles, and joined FELT as their main English lyricist from "Blue Drop" at Comiket 80 (2011), working with Maurits "Zen" Cornelis, Vivienne, and NAGI☆ until FELT's disbandment at Comiket 99 (2021).  

    Since then, she has continued to collaborate with various international and Japanese composers, artists, and circles, such as A-One, SuganoMusic, IOSYS, Frozen Starfall, Machikado-Mapoze, and SOUND HOLIC, which led to works in beatmania IIDX, DANCE aROUND, DANCERUSH STARDOM, and Arcaea.
    [Twitter](//twitter.com/renko_)
- name: Odyssey Eurobeat
  desc: |
    Odyssey Eurobeat captivated last year's TouhouFest crowd at the stage, and she will be returning once again for Touhoufest 2024!

    Odyssey, (aka "Stebbins" on A-One Records' Toho Eurobeat series) has been making iconic eurobeat remixes of ZUN's music work with SUGANO MUSIC to her own releases such as On The Moon and Our Desires, she has captured the attention of Touhou fans and eurobeat fans the world over with energetic riffs and blitzing beats. 

    Her live performances deliver just as much energy and are not to be missed!
    [Linktree](//linktr.ee/odysseyeurobeat)
- name: TAMusic
  desc: |
    TAMusic wowed the attendees of last year’s TouhouFest with his appearance! Please welcome him back for TouhouFest 2024!

    Music circle TAMUSIC is run by its head musician TAM and is the world's most prolific and largest Doujin music circle. He is capable of improvising any song he has listened to, and composes music that plays with 30 different types of instruments. Currently the world's first publisher of Touhou Ensou Douga (東方演奏動画).

    Since 2004, his Youtube channel has reached 120k subscribers, 60 million replays, and he has released 192 Touhou doujin music CDs, produced over 2000 rearrange music tracks, and traveled across the world and performed in 20 different locations across Asia, North America, and Europe.

    Socials:

    twitter: @tamusic<br>
    IG: @tam.tamusic
    [Twitter](//twitter.com/tamusic)
- name: A-One Records
  desc: |
    Get ready to SCREAM OUT as A-One Records, the doujin circle behind TOHO EUROBEAT album series, joins us from overseas as our final guest for TouhouFest this year!

    Founded by Yassie and ELEMENTAS in 2008, A-One Records has since then become a household name in the Touhou remix and Eurobeat scenes alike, producing the TOHO EUROBEAT, SUPER EURO SMASH and EUROBEAT ATTACK!! album series.

    This year, A-ONE Records will be performing a live concert starring ELEMENTAS, Rute and Aki, truly an experience that must be seen to be believed!

    Socials:

    Youtube: https://www.youtube.com/@A-One/

    Official Shop: https://a-one.booth.pm
    [Twitter](//twitter.com/A_One_JP)
