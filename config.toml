# The URL the site will be built for
base_url = "https://touhoufest.org"
title = "TouhouFest"
description = "TouhouFest is an annual Touhou Project fan convention held at the Torrance Cultural Arts Center in Torrance, California, featuring concerts, artist alley, gaming, cosplay, and special guests."

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Minify generated HTML, inline CSS/JS, and compiled Sass
minify_html = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true

